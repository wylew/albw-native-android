# Android build check without a ROM: SDL3 for armeabi-v7a, every native C source compiled with the
# NDK for 32-bit ARM, and the APK shell (launcher + SDLActivity). The full game library needs your
# ROM, so it is built locally (./build_android.sh /path/to/rom.3ds).
name: android-check
on:
  push:
    branches: [android-port, main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build
      - name: Check build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: ./build_android.sh --check
